<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Catalogue</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b4cca'/%3E%3Cpath d='M9 16l5 5 9-10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <h1>Test Catalogue</h1>
          <span class="muted" id="app-name">ShopNest</span>
        </div>
        <div class="toolbar">
          <button type="button" class="btn btn-primary" id="add-btn" data-testid="add-test-button">Add test case</button>
          <button type="button" class="btn" id="reload-btn" data-testid="reload-button" title="Re-read the catalogue file">Reload</button>
          <button type="button" class="btn" id="export-btn" data-testid="export-button">Export JSON</button>
          <label class="btn" for="import-input" data-testid="import-button">Import JSON</label>
          <input type="file" id="import-input" accept="application/json,.json" hidden data-testid="import-input" />
        </div>
      </div>
    </header>

    <main class="container">
      <div id="banner" class="banner" role="status" hidden></div>

      <section class="summary" id="summary" aria-label="Summary" data-testid="summary"></section>

      <section class="filters" aria-label="Filters">
        <input type="search" id="search" placeholder="Search ID, title, objective, steps…" aria-label="Search" data-testid="search-input" />
        <select id="filter-layer" aria-label="Layer" data-testid="filter-layer"><option value="">All layers</option></select>
        <select id="filter-priority" aria-label="Priority" data-testid="filter-priority"><option value="">All priorities</option></select>
        <select id="filter-automationStatus" aria-label="Automation status" data-testid="filter-automation"><option value="">All automation</option></select>
        <select id="filter-latestResult" aria-label="Latest result" data-testid="filter-result"><option value="">All results</option></select>
        <button type="button" class="btn btn-link" id="clear-filters" data-testid="clear-filters">Clear</button>
      </section>

      <p class="muted small" id="result-count" data-testid="result-count"></p>

      <div class="table-wrap">
        <table class="table" data-testid="catalogue-table">
          <thead>
            <tr>
              <th scope="col" data-sort="id">ID</th>
              <th scope="col" data-sort="title">Title</th>
              <th scope="col" data-sort="layer">Layer</th>
              <th scope="col" data-sort="priority">Priority</th>
              <th scope="col" data-sort="automationTarget">Target</th>
              <th scope="col" data-sort="automationStatus">Automation</th>
              <th scope="col" data-sort="latestResult">Result</th>
              <th scope="col" data-sort="lastExecuted">Last run</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </main>

    <dialog id="detail" class="detail" data-testid="detail-dialog" aria-labelledby="detail-title">
      <div class="detail-inner" id="detail-body"></div>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
